<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pordle</title>
  <style>
    :root {
      --bg-1: #f7f2e8;
      --bg-2: #e8efe7;
      --ink: #1f2d2f;
      --tile: #ffffff;
      --tile-border: #9fb0b2;
      --correct: #2f7d32;
      --present: #b68216;
      --absent: #687478;
      --keyboard-key: #dde6e7;
      --keyboard-ink: #253739;
      --shadow: rgba(24, 33, 34, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Trebuchet MS", "Gill Sans", "Segoe UI", sans-serif;
      color: var(--ink);
      background: #ffffff;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: max(0.375rem, env(safe-area-inset-top)) 0.75rem max(0.75rem, env(safe-area-inset-bottom));
      overflow-x: hidden;
      overscroll-behavior-y: none;
    }

    .app {
      width: min(100%, 430px);
      background: #ffffff;
      border: 0;
      border-radius: 0;
      backdrop-filter: none;
      box-shadow: none;
      padding: 0.5rem 0.9rem 1.1rem;
      display: grid;
      gap: 0.85rem;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .topbar-controls {
      display: flex;
      gap: 0.45rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    h1 {
      font-size: 1.6rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .pill {
      border: 1px solid rgba(38, 54, 56, 0.3);
      background: #f6faf9;
      color: var(--ink);
      border-radius: 999px;
      padding: 0.45rem 0.75rem;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      min-width: 0;
    }

    .pill:active {
      transform: scale(0.98);
    }

    .status {
      min-height: 1.25rem;
      font-size: 0.93rem;
      font-weight: 700;
      text-align: center;
      color: #334649;
    }

    .board {
      display: grid;
      gap: 0.27rem;
      margin: 0 auto;
      width: min(100%, 280px);
    }

    .row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.27rem;
    }

    .tile {
      aspect-ratio: 1 / 1;
      border: 2px solid var(--tile-border);
      background: var(--tile);
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: clamp(1.07rem, 4.7vw, 1.4rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      user-select: none;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease, color 120ms ease;
    }

    .tile.filled {
      border-color: #708285;
    }

    .tile.pop {
      animation: pop 120ms ease;
    }

    .tile.correct {
      background: var(--correct);
      border-color: var(--correct);
      color: #fff;
    }

    .tile.present {
      background: var(--present);
      border-color: var(--present);
      color: #fff;
    }

    .tile.absent {
      background: var(--absent);
      border-color: var(--absent);
      color: #fff;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.09); }
      100% { transform: scale(1); }
    }

    .keyboard {
      display: grid;
      gap: 0.35rem;
    }

    .keyrow {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 0.35rem;
    }

    .key {
      border: 0;
      border-radius: 8px;
      background: var(--keyboard-key);
      color: var(--keyboard-ink);
      font-weight: 800;
      font-size: 0.82rem;
      min-height: 2.6rem;
      min-width: 0;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
    }

    .key.action {
      grid-column: span 2;
      font-size: 0.72rem;
      letter-spacing: 0;
    }

    .key.correct {
      background: var(--correct);
      color: #fff;
    }

    .key.present {
      background: var(--present);
      color: #fff;
    }

    .key.absent {
      background: var(--absent);
      color: #fff;
    }

    .footer {
      text-align: center;
      font-size: 0.78rem;
      color: #4b5f62;
    }

    @media (max-width: 420px) {
      .app {
        padding: 0.425rem 0.65rem 1rem;
        gap: 0.72rem;
      }

      h1 {
        font-size: 1.38rem;
      }

      .board {
        width: min(100%, 253px);
      }

      .row {
        gap: 0.21rem;
      }

      .tile {
        font-size: clamp(0.96rem, 5.6vw, 1.27rem);
      }

      .keyrow {
        gap: 0.25rem;
      }

      .key {
        min-height: 2.3rem;
        font-size: 0.74rem;
        padding: 0 0.12rem;
      }

      .key.action {
        font-size: 0.64rem;
      }

      .pill {
        padding: 0.38rem 0.6rem;
        font-size: 0.78rem;
      }
    }

    @media (max-width: 360px) {
      .app {
        padding: 0.4rem 0.6rem 0.9rem;
      }

      .topbar {
        flex-direction: column;
        align-items: stretch;
        gap: 0.55rem;
      }

      h1 {
        text-align: center;
      }

      .topbar-controls {
        justify-content: center;
      }

      .board {
        width: min(100%, 235px);
      }

      .key {
        min-height: 2.35rem;
      }
    }
  </style>
</head>

    const ROWS = 6;
    const COLS = 5;
    const KEY_GRID = [
      ["Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P"],
      ["A", "S", "D", "F", "G", "H", "J", "K", "L", "M"],
      ["Z", "X", "C", "V", "B", "N", "DEL", "ENTER", "", ""]
    ];

    const boardEl = document.getElementById("board");
    const statusEl = document.getElementById("status");

    const keyboardEl = document.getElementById("keyboard");

    let solution = "";
    let guesses = [];
    let currentGuess = "";
    let gameOver = false;
    let enterHoldTimer = null;
    let suppressEnterTap = false;

    const HELP_HOLD_MS = 3000;

    const allowedWords = new Set(BRITISH_WORDS);

    function pickRandomWord() {
      const index = Math.floor(Math.random() * BRITISH_WORDS.length);
      return BRITISH_WORDS[index];
    }

    function announce(message) {
      statusEl.textContent = message;
    }

    function createBoard() {
      boardEl.innerHTML = "";
      for (let r = 0; r < ROWS; r += 1) {
        const row = document.createElement("div");
        row.className = "row";
        for (let c = 0; c < COLS; c += 1) {
          const tile = document.createElement("div");
          tile.className = "tile";
          tile.setAttribute("role", "gridcell");
          tile.dataset.row = String(r);
          tile.dataset.col = String(c);
          row.appendChild(tile);
        }
        boardEl.appendChild(row);
      }
    }

    function makeKey(label) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "key";
      button.dataset.key = label;
      if (label === "ENTER" || label === "DEL") {
        button.classList.add("action");
      }
      button.textContent = label === "DEL" ? "Delete" : label;
      button.setAttribute("aria-label", label === "DEL" ? "Delete letter" : label);

      if (label === "ENTER") {
        const startHold = () => {
          clearTimeout(enterHoldTimer);
          suppressEnterTap = false;
          enterHoldTimer = setTimeout(() => {
            suppressEnterTap = true;
            giveHint();
          }, HELP_HOLD_MS);
        };

        const endHold = () => {
          clearTimeout(enterHoldTimer);
          enterHoldTimer = null;
          if (suppressEnterTap) {
            suppressEnterTap = false;
            return;
          }
          handleInput(label);
        };

        const cancelHold = () => {
          clearTimeout(enterHoldTimer);
          enterHoldTimer = null;
          suppressEnterTap = false;
        };

        button.addEventListener("touchstart", (event) => {
          event.preventDefault();
          startHold();
        }, { passive: false });
        button.addEventListener("touchend", (event) => {
          event.preventDefault();
          endHold();
        }, { passive: false });
        button.addEventListener("touchcancel", cancelHold);

        button.addEventListener("mousedown", (event) => {
          event.preventDefault();
          startHold();
        });
        button.addEventListener("mouseup", (event) => {
          event.preventDefault();
          endHold();
        });
        button.addEventListener("mouseleave", cancelHold);
        button.addEventListener("click", (event) => event.preventDefault());
        return button;
      }

      button.addEventListener("touchend", (event) => {
        event.preventDefault();
        handleInput(label);
      }, { passive: false });
      button.addEventListener("click", () => handleInput(label));
      return button;
    }

    function createKeyboard() {
      keyboardEl.innerHTML = "";
      KEY_GRID.forEach((row) => {
        const rowEl = document.createElement("div");
        rowEl.className = "keyrow";
        row.forEach((label) => {
          if (!label) {
            const spacer = document.createElement("div");
            spacer.setAttribute("aria-hidden", "true");
            rowEl.appendChild(spacer);
            return;
          }
          rowEl.appendChild(makeKey(label));
        });
        keyboardEl.appendChild(rowEl);
      });
    }

    function updateBoard() {
      const tiles = boardEl.querySelectorAll(".tile");
      tiles.forEach((tile) => {
        const row = Number(tile.dataset.row);
        const col = Number(tile.dataset.col);
        const guess = guesses[row] || (row === guesses.length ? currentGuess : "");
        const letter = guess[col] || "";
        tile.textContent = letter;
        tile.classList.toggle("filled", letter !== "");
        if (!tile.classList.contains("correct") && !tile.classList.contains("present") && !tile.classList.contains("absent")) {
          tile.classList.remove("pop");
        }
      });
    }

    function scoreGuess(guess, answer) {
      const marks = Array(COLS).fill("absent");
      const answerLetters = answer.split("");

      for (let i = 0; i < COLS; i += 1) {
        if (guess[i] === answerLetters[i]) {
          marks[i] = "correct";
          answerLetters[i] = "*";
        }
      }

      for (let i = 0; i < COLS; i += 1) {
        if (marks[i] === "correct") continue;
        const idx = answerLetters.indexOf(guess[i]);
        if (idx > -1) {
          marks[i] = "present";
          answerLetters[idx] = "*";
        }
      }

      return marks;
    }

    function setKeyState(letter, state) {
      const key = document.querySelector(`.key[data-key="${letter}"]`);
      if (!key) return;
      const rank = { absent: 1, present: 2, correct: 3 };
      const current = key.classList.contains("correct")
        ? "correct"
        : key.classList.contains("present")
          ? "present"
          : key.classList.contains("absent")
            ? "absent"
            : "";
      if (!current || rank[state] > rank[current]) {
        key.classList.remove("absent", "present", "correct");
        key.classList.add(state);
      }
    }

    function revealGuess(guessIndex, marks) {
      const row = boardEl.children[guessIndex];
      [...row.children].forEach((tile, i) => {
        tile.classList.add(marks[i]);
        setKeyState(guesses[guessIndex][i], marks[i]);
      });
    }

    function isPositionAlreadyGuessed(position) {
      const expectedLetter = solution[position];
      if (currentGuess[position] === expectedLetter) {
        return true;
      }
      return guesses.some((guess) => guess[position] === expectedLetter);
    }

    function giveHint() {
      if (gameOver) {
        announce("Game is over. Start a new game for hints.");
        return;
      }

      for (let i = 0; i < COLS; i += 1) {
        if (!isPositionAlreadyGuessed(i)) {
          announce(`Hint: letter ${i + 1} is ${solution[i]}.`);
          return;
        }
      }

      announce("All letter positions have already been guessed.");
    }

    function submitGuess() {
      if (currentGuess.length < COLS) {
        announce("Word must be 5 letters.");
        return;
      }
      if (!allowedWords.has(currentGuess.toLowerCase())) {
        announce("Not in British dictionary.");
        return;
      }

      const guess = currentGuess.toUpperCase();
      guesses.push(guess);
      currentGuess = "";
      updateBoard();

      const marks = scoreGuess(guess, solution);
      revealGuess(guesses.length - 1, marks);

      if (guess === solution) {
        gameOver = true;
        announce("Brilliant! You solved Pordle.");
        return;
      }

      if (guesses.length >= ROWS) {
        gameOver = true;
        announce(`Out of tries. The word was ${solution}.`);
        return;
      }

      announce("Keep going.");
    }

    function handleInput(raw) {
      if (gameOver) return;

      const key = raw.toUpperCase();

      if (key === "ENTER") {
        submitGuess();
        return;
      }

      if (key === "BACKSPACE" || key === "DEL") {
        if (currentGuess.length > 0) {
          currentGuess = currentGuess.slice(0, -1);
          updateBoard();
        }
        return;
      }

      if (/^[A-Z]$/.test(key) && currentGuess.length < COLS) {
        currentGuess += key;
        updateBoard();

        const row = boardEl.children[guesses.length];
        const tile = row.children[currentGuess.length - 1];
        tile.classList.add("pop");
        setTimeout(() => tile.classList.remove("pop"), 130);
      }
    }

    function resetGame() {
      solution = pickRandomWord().toUpperCase();
      guesses = [];
      currentGuess = "";
      gameOver = false;
      createBoard();
      createKeyboard();
      announce("Guess the 5-letter word.");
    }

    document.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        handleInput("ENTER");
        return;
      }
      if (event.key === "Backspace") {
        handleInput("BACKSPACE");
        return;
      }
      if (/^[a-zA-Z]$/.test(event.key)) {
        handleInput(event.key);
      }
    });

    resetGame();
  </script>
